name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  regression:
    name: Regression (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, catalog, commerce, operations, journey]
    env:
      POSTGRES_TEST_BIN: /usr/lib/postgresql/18/bin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chrome chromium

      - name: Install isolated PostgreSQL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates curl xvfb xauth
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/fan-support-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18
          /usr/lib/postgresql/18/bin/postgres --version

      - name: Run isolated regression suite
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm verify:regression --suite ${{ matrix.suite }} --output output/checks/p6-01-regression/ci

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-${{ matrix.suite }}
          path: output/checks/p6-01-regression/ci
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    needs: regression
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every regression suite
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: test "$REGRESSION_RESULT" = success

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Scan repository for secrets
        run: pnpm security:secrets
