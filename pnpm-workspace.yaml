packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# braces is reached only through @next/eslint-plugin-next and has no upstream
# fix; scripts/security-dependencies.test.mjs keeps it off production paths.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

autoInstallPeers: false
engineStrict: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - pg-boss@12.30.0
preferWorkspacePackages: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
verifyStoreIntegrity: true
